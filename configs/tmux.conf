# Dedicated Workbot server; never inherit the operator's personal tmux config.
set -g status off
set -g mouse on
set -s set-clipboard on
set -s extended-keys on
set -sq extended-keys-format csi-u
set -as terminal-features ',xterm-256color:clipboard:extkeys'
# 固定复制到系统剪贴板，并读取但不输出第一个参数，避免 ncurses 校验失败。
set -as terminal-overrides ',xterm-256color:Ms=\E]52;c%p1%.0s;%p2%s\007'
set -g default-terminal tmux-256color
set -s escape-time 10
set -g destroy-unattached off
set -s exit-unattached off
set -g remain-on-exit off
set -g window-size latest
